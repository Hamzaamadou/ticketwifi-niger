<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">

  <title>Créer un compte propriétaire - TicketWifi Niger</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fa;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .register-container {
      width: 100%;
      max-width: 680px;
      margin: 25px auto;
      padding: 30px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 16px;
    }

    .register-container h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      margin-bottom: 23px;
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      min-width: 0;
      height: 54px;
      padding: 0 15px;
      border: 1px solid #ddd;
      border-radius: 15px;
      background: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff8a00;
    }

    .phone-row {
      display: grid;
      grid-template-columns: 42% 58%;
      gap: 10px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 55px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      color: #777;
      font-size: 19px;
      cursor: pointer;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 17px;
      border: 1px solid #ddd;
      border-radius: 17px;
      margin: 25px 0;
    }

    .terms input {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .terms label {
      font-weight: normal;
      line-height: 1.5;
      margin: 0;
    }

    .terms a {
      color: #2563eb;
      font-weight: bold;
    }

    .btn-register {
      width: 100%;
      height: 58px;
      background: #151515;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-register:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .login-link {
      text-align: center;
      margin-top: 35px;
      padding: 25px 10px;
      border-top: 1px solid #eee;
      color: #777;
    }

    .login-link a {
      color: #151515;
      font-weight: bold;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .register-container {
        margin: 0 auto;
        padding: 22px 18px;
        border-radius: 0;
      }

      .register-container h1 {
        font-size: 27px;
      }

      .form-row {
        gap: 12px;
      }

      input, select {
        font-size: 15px;
        padding: 0 11px;
      }

      .phone-row {
        grid-template-columns: 43% 57%;
        gap: 7px;
      }
    }
    
/* CORRECTION VISIBILITÉ DES CHAMPS */

.register-container input,
.register-container select {
  color: #222222 !important;
  -webkit-text-fill-color: #222222 !important;
  background-color: #ffffff !important;
  opacity: 1 !important;
  font-weight: 500;
}

.register-container input::placeholder {
  color: #777777 !important;
  -webkit-text-fill-color: #777777 !important;
  opacity: 1 !important;
}

.register-container label {
  color: #222222 !important;
  font-weight: 600;
}

.register-container input:focus,
.register-container select:focus {
  border: 2px solid #ff8a00 !important;
  outline: none;
}

/* Compatibilité Android */
.register-container input:-webkit-autofill {
  -webkit-text-fill-color: #222222 !important;
  transition: background-color 9999s;
}

    /* IDENTITE VISUELLE SOMBRE - TICKETWIFI NIGER */
    :root {
      color-scheme: dark;
      --tw-navy: #0b1728;
      --tw-blue: #10243a;
      --tw-panel: #172c42;
      --tw-field: #263b50;
      --tw-border: #52677d;
      --tw-orange: #ff8a00;
      --tw-white: #f8fafc;
      --tw-muted: #c3cfdb;
    }

    html, body {
      min-height: 100%;
      background: linear-gradient(135deg, #071426 0%, #102b4a 55%, #0b1c33 100%) !important;
      color: var(--tw-white) !important;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .header {
      background: #0b1728 !important;
      color: var(--tw-white) !important;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .header a, .header .logo {
      color: var(--tw-white) !important;
    }

    .header .logo span {
      color: var(--tw-orange) !important;
    }

    .register-container {
      background: rgba(16, 36, 58, .96) !important;
      color: var(--tw-white) !important;
      border: 1px solid rgba(164, 190, 215, .25) !important;
      border-radius: 20px !important;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .28);
    }

    .register-container h1,
    .register-container label,
    .register-container .terms label,
    .register-container .login-link {
      color: var(--tw-white) !important;
    }

    .register-container .subtitle,
    .register-container .trial,
    .register-container .login-link {
      color: var(--tw-muted) !important;
    }

    .register-container .trial {
      background: rgba(255, 138, 0, .10);
      border: 1px solid rgba(255, 138, 0, .35);
      border-radius: 12px;
      padding: 12px 14px;
      margin: 0 0 24px;
    }

    .register-container input:not([type="checkbox"]),
    .register-container select {
      color: var(--tw-white) !important;
      -webkit-text-fill-color: var(--tw-white) !important;
      background: var(--tw-field) !important;
      border: 1px solid var(--tw-border) !important;
      opacity: 1 !important;
    }

    .register-container input:not([type="checkbox"])::placeholder {
      color: #c1ccd8 !important;
      -webkit-text-fill-color: #c1ccd8 !important;
      opacity: 1 !important;
    }

    .register-container input:not([type="checkbox"]):focus,
    .register-container select:focus {
      border: 2px solid var(--tw-orange) !important;
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 138, 0, .16);
    }

    .register-container select option {
      color: #f8fafc;
      background: #263b50;
    }

    .password-wrapper .toggle-password {
      color: #e2e8f0 !important;
    }

    .register-container .terms {
      background: rgba(38, 59, 80, .72) !important;
      border: 1px solid var(--tw-border) !important;
      border-radius: 15px;
    }

    .register-container .terms input[type="checkbox"] {
      accent-color: var(--tw-orange);
    }

    .register-container .terms a {
      color: #ffb454 !important;
    }

    .register-container .btn-register {
      background: var(--tw-orange) !important;
      color: #172033 !important;
      border: 0 !important;
      border-radius: 14px;
      font-weight: 700;
      box-shadow: 0 7px 18px rgba(255, 138, 0, .18);
    }

    .register-container .btn-register:hover {
      background: #ffa329 !important;
    }

    .register-container .btn-register:disabled {
      background: #bd741b !important;
      color: #172033 !important;
    }

    .register-container #message {
      color: var(--tw-white);
    }

    .register-container .login-link {
      border-top: 1px solid rgba(195, 207, 219, .22) !important;
    }

    .register-container .login-link a {
      color: #ffb454 !important;
    }

    @media (max-width: 480px) {
      .register-container {
        width: calc(100% - 20px);
        margin: 14px auto;
        padding: 22px 16px;
        border-radius: 18px !important;
      }

      .register-container .form-row {
        grid-template-columns: 1fr;
      }

      .register-container .phone-row {
        grid-template-columns: minmax(0, 42%) minmax(0, 58%);
        gap: 8px;
      }
    }

  </style>
</head>

<body>

  <header class="header">
    <a class="logo" href="index.html">
      Ticket<span>Wifi</span> Niger
    </a>
  </header>

  <main class="register-container">

    <h1>Créer un compte</h1>

    <p class="subtitle">
      Rejoignez TicketWifi Niger et vendez vos tickets WiFi
      en toute simplicité.
    </p>

    <div class="trial">
      🎉 Profitez de 10 jours d'essai gratuit.
    </div>

    <form id="ownerRegisterForm">

      <div class="form-row">

        <div class="form-group">
          <label for="ownerName">Prénom et Nom</label>
          <input
            id="ownerName"
            type="text"
            placeholder="Votre nom complet"
            required
          >
        </div>

        <div class="form-group">
          <label for="ownerCity">Ville</label>
          <input
            id="ownerCity"
            type="text"
            placeholder="Niamey"
            required
          >
        </div>

      </div>

      <div class="form-group">
        <label for="ownerEmail">Adresse e-mail</label>
        <input
          id="ownerEmail"
          type="email"
          placeholder="nom@exemple.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="ownerPhone">
          Numéro WhatsApp <span style="color:#999">(facultatif)</span>
        </label>

        <div class="phone-row">

          <select id="phoneCountry">
            <option value="+227">Niger (+227)</option>
            <option value="+226">Burkina Faso (+226)</option>
            <option value="+229">Bénin (+229)</option>
            <option value="+223">Mali (+223)</option>
            <option value="+221">Sénégal (+221)</option>
            <option value="+225">Côte d'Ivoire (+225)</option>
            <option value="+228">Togo (+228)</option>
          </select>

          <input
            id="ownerPhone"
            type="tel"
            placeholder="80 00 00 00"
          >

        </div>
      </div>

      <div class="form-group">
        <label for="ownerPassword">Mot de passe</label>

        <div class="password-wrapper">
          <input
            id="ownerPassword"
            type="password"
            placeholder="8 caractères minimum"
            minlength="8"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="ownerPassword"
            aria-label="Afficher le mot de passe"
          >◉</button>
        </div>
      </div>

      <div class="form-group">
        <label for="ownerPasswordConfirm">
          Confirmer le mot de passe
        </label>

        <div class="password-wrapper">
          <input
            id="ownerPasswordConfirm"
            type="password"
            placeholder="Confirmez votre mot de passe"
            minlength="8"
            required
          >

          <button
            type="button"
            class="toggle-password"
            data-target="ownerPasswordConfirm"
            aria-label="Afficher le mot de passe"
          >◉</button>
        </div>
      </div>

      <div class="form-group">
        <label for="businessName">Nom de la Zone WiFi</label>
        <input
          id="businessName"
          type="text"
          placeholder="Ma Zone WiFi"
          required
        >
      </div>

      <div class="terms">

        <input
          id="acceptTerms"
          type="checkbox"
          required
        >

        <label for="acceptTerms">
          J'accepte les
          <a href="conditions.html" target="_blank">
            conditions générales d'utilisation
          </a>.
        </label>

      </div>

      <button
        type="submit"
        class="btn-register"
        id="registerButton"
      >
        S'inscrire
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="login-link">
      Déjà un compte ?
      <a href="owner-login.html">Se connecter</a>
    </div>

  </main>

  <script>
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        input.type = input.type === "password" ? "text" : "password";
      });
    });
  </script>

  <script type="module" src="owner-register.js"></script>

</body>
</html>
