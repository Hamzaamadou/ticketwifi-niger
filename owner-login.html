<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion à l'espace propriétaire TicketWifi Niger">
  <title>Connexion propriétaire - TicketWifi Niger</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #071525, #102b50, #172d69);
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .header {
      width: 100%;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(5, 16, 32, 0.85);
    }

    .header h1 {
      font-size: 25px;
      margin: 0;
      color: white;
    }

    .btn-outline {
      color: white;
      text-decoration: none;
      border: 1px solid #ff9f1c;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .container {
      min-height: calc(100vh - 75px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
    }

    .card {
      width: 100%;
      max-width: 550px;
      padding: 35px;
      border-radius: 18px;
      background: rgba(12, 29, 52, 0.95);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .card h2 {
      text-align: center;
      font-size: 28px;
      margin-top: 0;
      color: white;
    }

    .card > p {
      text-align: center;
      color: #c4d1e3;
      line-height: 1.6;
    }

    form {
      display: flex;
      flex-direction: column;
      margin-top: 25px;
    }

    form label {
      margin: 15px 0 8px;
      color: white;
      font-weight: 600;
    }

    form input {
      width: 100%;
      padding: 15px;
      border: 1px solid #53677f;
      border-radius: 10px;
      background: #263b54;
      color: white;
      font-size: 16px;
      outline: none;
    }

    form input::placeholder {
      color: #bdc9d8;
    }

    form input:focus {
      border-color: #ffad32;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff9f1c, #ffc247);
      color: #172033;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    #loginMessage {
      color: #ffffff;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .card a:not(.btn-outline) {
      color: #ffb638;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .header {
        padding: 17px;
      }

      .header h1 {
        font-size: 21px;
      }

      .container {
        padding: 25px 15px;
      }

      .card {
        padding: 25px 20px;
      }

      .card h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>TicketWifi Niger</h1>
    <a href="index.html" class="btn-outline">Accueil</a>
  </header>

  <main class="container">
    <section class="card">

      <h2>Espace propriétaire</h2>

      <p>
        Connectez-vous pour gérer vos zones Wi-Fi
        et vos forfaits.
      </p>

      <form id="ownerLoginForm">

        <label for="ownerEmail">Adresse e-mail</label>
        <input
          type="email"
          id="ownerEmail"
          placeholder="Votre adresse e-mail"
          required
        >

        <label for="ownerPassword">Mot de passe</label>
        <input
          type="password"
          id="ownerPassword"
          placeholder="Votre mot de passe"
          required
        >

        <button type="submit" id="loginButton" class="btn-primary">
          Se connecter
        </button>

      </form>

      <p id="loginMessage"></p>

      <p>
        Pas encore de compte ?
        <a href="owner-register.html">Devenir propriétaire</a>
      </p>

    </section>
  </main>

  <script type="module" src="owner-login.js"></script>

</body>
</html>
