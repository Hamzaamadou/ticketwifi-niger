
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion à l'espace propriétaire TicketWifi Niger">
  <title>Connexion propriétaire - TicketWifi Niger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>TicketWifi Niger</h1>
    <a href="index.html" class="btn-outline">Accueil</a>
  </header>

  <main class="container">
    <section class="card">
      <h2>Espace propriétaire</h2>
      <p>Connectez-vous pour gérer vos zones Wi-Fi et vos forfaits.</p>

      <form id="ownerLoginForm">
        <label for="ownerEmail">Adresse e-mail</label>
        <input
          type="email"
          id="ownerEmail"
          placeholder="Votre adresse e-mail"
          required
        >

        <label for="ownerPassword">Mot de passe</label>
        <input
          type="password"
          id="ownerPassword"
          placeholder="Votre mot de passe"
          required
        >

        <button type="submit" id="loginButton" class="btn-primary">
          Se connecter
        </button>
      </form>

      <p id="loginMessage"></p>

      <p>
        Pas encore de compte ?
        <a href="owner-register.html">Devenir propriétaire</a>
      </p>
    </section>
  </main>

  <script type="module" src="owner-login.js"></script>
</body>
</html>
